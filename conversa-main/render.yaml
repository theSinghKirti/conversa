services:
  - type: web
    name: conversa-backend
    runtime: node
    rootDir: conversa-main/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5500

      # ── Database ────────────────────────────────────────────────────────────
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: conversa

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      # ── Frontend / CORS ─────────────────────────────────────────────────────
      # Set FRONTEND_URL to your Vercel URL, e.g. https://conversa-nu-taupe.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

      # ── Email (Brevo Transactional) ─────────────────────────────────────────
      # Required for OTP and activation emails to work in production.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Conversa

      # ── AI Providers ────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # ── Admin seeding ───────────────────────────────────────────────────────
      # On first deploy: auto-seeds admin when no ADMIN user exists in DB.
      # Safe on all subsequent restarts (skips if admin already present).
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
